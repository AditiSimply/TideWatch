version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tidewatch-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./tidewatch.db}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENV=${ENV:-development}
    volumes:
      - ./artifacts:/app/artifacts
      - ./tidewatch.db:/app/tidewatch.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # ── Optional: local Ollama service ─────────────────────────────────────────
  # Set LLM_PROVIDER=ollama in your .env to use this.
  # On first run: docker exec -it tidewatch-ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    container_name: tidewatch-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama   # only starts when: docker compose --profile ollama up
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tidewatch-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_SSE_URL=http://localhost:8000/api/v1/stream/traffic
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:
